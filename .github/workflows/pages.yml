name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write config.js from repository variables (optional)
        run: |
          if [ -n "${{ vars.WORLDSMITH_API_URL }}" ]; then
            printf 'window.WORLDSMITH_API={url:%s,key:%s};\n' "$(printf %s "${{ vars.WORLDSMITH_API_URL }}" | python3 -c 'import json,sys;print(json.dumps(sys.stdin.read()))')" "$(printf %s "${{ vars.WORLDSMITH_API_KEY }}" | python3 -c 'import json,sys;print(json.dumps(sys.stdin.read()))')" > config.js
          elif [ ! -f config.js ]; then echo "// no API configured" > config.js; fi
      - name: Stage site
        run: mkdir -p _site && cp -r index.html config.js src _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
