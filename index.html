<title>Worldsmith 게놈 컴파일러</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D stage; left genome panel; bottom word bar. Single dark look (game tool). */
:root{
  --bg:#0B1020; --fg:#F2EFE6; --muted:#B9B4A6; --dim:#6B6F84; --panel:rgba(11,16,32,.84); --line:#3A3F5C;
  --gold:#D4A94E; --gold2:#F0C86A; --good:#7FD3A6;
  --serif:'Nanum Myeongjo',serif; --sans:'Noto Sans KR',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#top{position:fixed;left:0;right:0;top:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(12px + env(safe-area-inset-top,0px)) 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;flex-wrap:wrap}
#top>*{pointer-events:auto}
#title{display:flex;flex-direction:column;gap:2px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
#title small{font-size:11px;letter-spacing:.18em;color:var(--gold)}
#title b{font-family:var(--serif);font-size:22px;font-weight:800}
#brain{font-size:11px;color:var(--muted)}#brain[data-state=claude]{color:var(--good)}
#era{display:flex;gap:6px;flex-wrap:wrap}
#era button{font:inherit;font-size:12px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
#era button[aria-pressed=true]{border-color:var(--gold);background:rgba(212,169,78,.14);color:var(--gold2)}
#left{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(84px + env(safe-area-inset-top,0px));width:300px;max-width:calc(100vw - 32px);display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 260px);overflow:auto}
#left .panel{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
h2{margin:0;font-family:var(--serif);font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
h2 span{font-family:var(--sans);font-size:10px;color:var(--muted);font-weight:400}
#genome{font:11px/1.5 ui-monospace,Menlo,monospace;color:#CFC8B8;white-space:pre-wrap;word-break:break-all;margin:0;max-height:180px;overflow:auto}
.twist{font-family:var(--serif);font-size:13px;line-height:1.5}
label.d{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
label.d b{color:var(--fg);font-weight:500}
input[type=range]{width:100%;accent-color:var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:inherit;font-size:11px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.chips button[aria-pressed=true]{border-color:var(--gold);background:rgba(212,169,78,.14)}
.chips button:disabled{border-style:dashed;color:var(--dim);cursor:not-allowed}
.sw{display:flex;gap:6px}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw button[aria-pressed=true]{border-color:var(--gold)}
#bottom{position:fixed;left:0;right:0;bottom:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#bottom>*{pointer-events:auto}
#ex,.edits{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.edits button{border-style:dashed!important}
#ex button{font:inherit;font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:#E6E1D2;cursor:pointer}
#ex button:hover{border-color:var(--gold)}
form#f{width:100%;max-width:720px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:10px;border-color:var(--gold);box-shadow:0 0 40px rgba(212,169,78,.18)}
form#f input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--fg);font-family:var(--serif);font-size:16px}
form#f input::placeholder{color:#8A8470}
form#f button:disabled{background:#3a3f55;color:#8c93aa;cursor:wait}
form#f button{font:inherit;height:42px;padding:0 18px;border:0;border-radius:7px;background:var(--gold);color:#1A1200;font-weight:700;font-size:14px;cursor:pointer}

#hint{font-size:11px;color:var(--muted);text-shadow:0 1px 6px rgba(0,0,0,.6);text-align:center}

.tag{position:absolute;transform:translate(-50%,-100%);background:#EFE4C8;color:#2A2418;border-radius:4px;padding:4px 9px;font-size:11px;font-weight:500;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.45);pointer-events:auto;cursor:pointer}
.tag.on{outline:2px solid var(--gold)}
#stat{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(140px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--muted);text-align:right;text-shadow:0 1px 6px rgba(0,0,0,.6)}
@media (max-width:720px){#left{display:none}}
</style>

<canvas id="gl"></canvas>
<div id="tags"></div>

<div id="top">
  <div id="title"><small>WORLDSMITH · 게놈 컴파일러 v0.2</small><b>같은 말, 다른 형태</b><span id="brain" data-state="local">세계의 뇌: 연결 확인 중</span></div>
  <div id="era" role="group" aria-label="시대와 땅"></div>
</div>

<div id="left">
  <section class="panel">
    <h2>세계가 읽은 뜻 <span id="gkind">게놈</span></h2>
    <div class="twist" id="twist">—</div>
    <pre id="genome">말을 기다리는 중</pre>
  </section>
  <section class="panel">
    <h2>손으로 빚기 <span>신성력 0 · 즉시</span></h2>
    <label class="d" for="d-size"><span>크기</span><b id="v-size">보통</b></label><input id="d-size" type="range" min="0" max="100" value="45">
    <label class="d" for="d-orn"><span>장식</span><b id="v-orn">보통</b></label><input id="d-orn" type="range" min="0" max="100" value="45">
    <label class="d" for="d-age"><span>세월</span><b id="v-age">새것</b></label><input id="d-age" type="range" min="0" max="100" value="10">
    <div style="font-size:11px;color:var(--muted)">색 · 땅의 팔레트</div>
    <div class="sw" id="sw"></div>
    <div style="font-size:11px;color:var(--muted)">재료 · 이 시대가 아는 것만</div>
    <div class="chips" id="mats"></div>
    <button id="reseed" style="font:inherit;font-size:12px;padding:8px;border-radius:6px;border:1px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer">다른 변주 3개 더 보기 · 신성력 0</button>
  </section>
</div>

<div id="stat"></div>

<div id="bottom">
  <div id="log" class="panel" hidden style="padding:6px 12px;font-size:12px;color:var(--gold2)"></div>
  <div id="ex"></div>
  <div id="ex" class="edits"><span style="font-size:11px;color:var(--muted);align-self:center">고치기 →</span><span id="ed" style="display:contents"></span></div>
  <form id="f" class="panel">
    <label for="q" hidden>말씀</label>
    <input id="q" type="text" placeholder="새로 빚거나(말씀) 고치거나(손길) · 예: 강가에 둥근 등대 / 지붕을 파랗게" autocomplete="off">
    <button id="go" type="submit">말하다</button>
  </form>
  <div id="hint">새 대상을 말하면 새로 빚고(신성력 1), 고치는 말이면 지금 것을 바꾼다(0). 드래그 회전 · 휠 확대.</div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { ERAS } from './src/eras.js';
import { parse, resolve, amend } from './src/genome.js';
import { hashString } from './src/rng.js';
import { askWorld } from './src/llm.js';
import { compileBuilding } from './src/compile/building.js';
import { compileCreature } from './src/compile/creature.js';
import { compileTree } from './src/compile/tree.js';
import { paint } from './src/compile/common.js';

const $ = id => document.getElementById(id);
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.85;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd8c9a8, 60, 140);
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 400);
camera.position.set(14, 11, 22);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.target.set(0, 2, 0); controls.maxPolarAngle = 1.45; controls.minDistance = 5; controls.maxDistance = 70;

// sky + light (golden afternoon by default)
const sky = new Sky(); sky.scale.setScalar(400); scene.add(sky);
const su = sky.material.uniforms; su.turbidity.value = 6; su.rayleigh.value = 2.2; su.mieCoefficient.value = 0.006; su.mieDirectionalG.value = 0.85;
const sunDir = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - 22), THREE.MathUtils.degToRad(160));
su.sunPosition.value.copy(sunDir);
const sun = new THREE.DirectionalLight(0xffe0b8, 3); sun.position.copy(sunDir).multiplyScalar(60); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); sun.shadow.camera.left = -30; sun.shadow.camera.right = 30; sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30; sun.shadow.camera.far = 150; sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.04; sun.shadow.radius = 4;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x6b5a3a, 0.9));
const pmrem = new THREE.PMREMGenerator(renderer); const envScene = new THREE.Scene(); envScene.add(sky.clone()); scene.environment = pmrem.fromScene(envScene, 0.04).texture; scene.environmentIntensity = 0.5;

const ground = new THREE.Mesh(new THREE.CircleGeometry(90, 64), new THREE.MeshStandardMaterial({ color: 0x8fa35a, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// soft painted ground patches
for (let i = 0; i < 40; i++) { const p = new THREE.Mesh(new THREE.CircleGeometry(2 + Math.random() * 6, 12), new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(0.22 + Math.random() * 0.06, 0.35, 0.33 + Math.random() * 0.12), roughness: 1 })); p.rotation.x = -Math.PI / 2; p.position.set((Math.random() - 0.5) * 120, 0.01, (Math.random() - 0.5) * 120); p.receiveShadow = true; scene.add(p); }

// ---------- state ----------
let eraKey = 'rome';
let text = '';
let baseGenome = null;
let seedBase = 1;
let picked = 1;
let overrides = { size: null, ornament: null, age: null, color: null, material: null };
const stage = new THREE.Group(); scene.add(stage);
const variants = []; // {obj, seed, label}

function compile(g, era, seed) {
  const gg = resolve(g, era, seed);
  if (gg.kind === 'creature') return compileCreature(gg, era, seed);
  if (gg.kind === 'tree') return compileTree(gg, era, seed);
  return compileBuilding(gg, era, seed);
}
function applyOverrides(g) {
  const o = structuredClone(g);
  if (overrides.size != null) o.size = overrides.size;
  if (overrides.ornament != null) o.ornament = overrides.ornament;
  if (overrides.age != null) o.age = overrides.age;
  if (overrides.color) { if (o.kind === 'building') o.wallColor = overrides.color; else o.color = overrides.color; }
  if (overrides.material && o.kind === 'building') o.wallColor = MAT_COLORS[overrides.material] || o.wallColor;
  return o;
}
const MAT_COLORS = { '석회석': '#E8DCC4', '대리석': '#F3EBDA', '벽돌': '#B9573C', '나무': '#8A6B3E', '통나무': '#6B4A2E', '돌': '#8E8A80', '기와': '#3A3A40', '흙': '#C68A4A', '황토': '#C9A86A', '이끼': '#5E7A3A', '뗏장': '#6B8A42', '짚': '#D9C27A', '직물': '#A6323C' };

function rebuild() {
  if (!baseGenome) return;
  const era = ERAS[eraKey];
  while (stage.children.length) stage.remove(stage.children[0]);
  variants.length = 0;
  const g = applyOverrides(baseGenome);
  const t0 = performance.now();
  const labels = ['변주 A', '변주 B', '변주 C'];
  for (let i = 0; i < 3; i++) {
    const seed = (seedBase * 7919 + i * 104729) >>> 0;
    const obj = compile(g, era, seed);
    const box = new THREE.Box3().setFromObject(obj); const w = Math.max(box.max.x - box.min.x, box.max.z - box.min.z);
    obj.position.x += (i - 1) * Math.max(9, w + 3);
    stage.add(obj);
    variants.push({ obj, seed, label: labels[i], h: box.max.y - box.min.y });
  }
  const ms = Math.round(performance.now() - t0);
  const tris = (() => { let n = 0; stage.traverse(o => { if (o.isMesh) n += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; }); return Math.round(n); })();
  $('stat').textContent = `컴파일 ${ms}ms · 삼각형 ${tris.toLocaleString()} · LLM 호출 ${llmCalls}`;
  const shown = resolve(g, era, variants[picked].seed);
  $('gkind').textContent = { building: '건물', creature: '생명체', tree: '나무' }[shown.kind];
  $('twist').textContent = '세계가 덧붙임 — ' + (shown.twist || '없음');
  $('genome').textContent = JSON.stringify(shown, (k, v) => (v === undefined ? undefined : v), 1).replace(/\n\s*/g, (m) => m.length > 2 ? '\n ' : m);
  ground.material.color.set(era.palette.ground);
  renderTags();
  if (fit) { const bb = new THREE.Box3().setFromObject(stage); const c = bb.getCenter(new THREE.Vector3()); const w = bb.max.x - bb.min.x, h = bb.max.y - bb.min.y;
    const dist = Math.max(w / 2 / Math.tan(camera.fov * Math.PI / 360) / camera.aspect, h / Math.tan(camera.fov * Math.PI / 360)) * 1.15 + 6;
    controls.target.set(c.x, h * 0.4, 0); camera.position.set(c.x + dist * 0.35, h * 0.5 + dist * 0.45, dist * 0.85); fit = false; }
}
let fit = true;
function renderTags() {
  const box = $('tags'); box.innerHTML = '';
  variants.forEach((v, i) => { const t = document.createElement('button'); t.className = 'tag' + (i === picked ? ' on' : ''); t.textContent = v.label + (i === picked ? ' · 선택됨' : ''); t.addEventListener('click', () => { picked = i; rebuild(); controls.target.set(v.obj.position.x, v.h * 0.45, 0); }); box.appendChild(t); v.tag = t; });
}
function updateTags() { for (const v of variants) { if (!v.tag) continue; const p = new THREE.Vector3(v.obj.position.x, v.h + 0.8, 0).project(camera); v.tag.style.left = ((p.x + 1) / 2 * innerWidth) + 'px'; v.tag.style.top = ((1 - p.y) / 2 * innerHeight) + 'px'; v.tag.style.display = p.z < 1 ? '' : 'none'; } }

// Brain: Claude via the page's `sample` capability when the viewer allows it; local parser otherwise.
let sample = null, brain = 'local', busy = false, llmCalls = 0;
(async () => { try { sample = await window.claude?.use?.('sample'); } catch { sample = null; } brain = sample ? 'claude' : 'local'; paintBrain(); })();
function paintBrain(msg) { const el = $('brain'); el.textContent = msg || (brain === 'claude' ? '세계의 뇌: Claude (첫 말에 허용 요청)' : '세계의 뇌: 로컬 규칙 (Claude 미연결)'); el.dataset.state = brain; }
const NEW_SUBJECT = /등대|신전|사원|성|탑|집|궁전|시장|빵집|창고|학교|서당|나무|숲|고래|용|사슴|늑대|새|곰|호랑이|물고기|뱀|말|소|오두막|다리|수로|가게|주막|국수|술집|도서관|대학|절|성당|사당|망루|요새|벚|소나무|거북|코끼리|사자|여우|토끼|라마|학|까마귀|독수리|드래곤|생명체|짐승|괴물/;
function localBrain(t) {
  if (baseGenome && (!NEW_SUBJECT.test(t) || /조각|장식|문양|새겨|달아|추가|붙여/.test(t))) { const a = amend(applyOverrides(baseGenome), t); if (a) return { ...a.genome, mode: 'edit', note: a.note }; }

}
async function speak(t) {
  if (!t.trim() || busy) return;
  busy = true; $('go').disabled = true; $('go').textContent = '듣는 중';
  $('log').hidden = false; $('log').textContent = '…';
  const current = baseGenome ? applyOverrides(baseGenome) : null;
  const res = await askWorld(sample, t, eraKey, current, (m) => { $('log').textContent = m; }, () => localBrain(t));
  if (res.dead) { sample = null; brain = 'local'; paintBrain(); }
  if (res.source === 'claude') llmCalls++;
  const g = res.genome; const isEdit = g.mode === 'edit' && baseGenome;
  const tag = res.source === 'claude' ? 'Claude' : '로컬';
  $('log').innerHTML = `${isEdit ? '손길 · 신성력 0' : '말씀 · 신성력 1'} · <b>${tag}</b>` + (g.name ? ` · "${g.name}"` : '') + (g.note ? ` · ${g.note}` : '') + (g.era_fit === 'reinterpreted' ? ' · <i>시대 해석</i>' : '');
  baseGenome = g;
  overrides = { size: null, ornament: null, age: null, color: null, material: null };
  syncDials();
  if (!isEdit) { text = t; seedBase = hashString(t + Date.now()) % 100000 + 1; picked = 1; fit = true; buildSwatches(); }
  rebuild();
  busy = false; $('go').disabled = false; $('go').textContent = '말하다';
}

function syncDials() { $('d-size').value = Math.round((baseGenome.size ?? 0.45) * 100); $('d-orn').value = Math.round((baseGenome.ornament ?? 0.45) * 100); $('d-age').value = Math.round((baseGenome.age ?? 0.1) * 100); }
// ---------- UI ----------
const EX = ['강가에 둥근 등대', '비 오는 날만 여는 재즈바', '언덕 위 큰 신전', '하늘을 나는 고래', '뿔 달린 거대한 사슴', '벚나무', '어부들이 쉴 수 있는 곳', '아이들이 신을 볼 수 있는 무언가'];
for (const e of EX) { const b = document.createElement('button'); b.type = 'button'; b.textContent = e; b.addEventListener('click', () => { $('q').value = e; speak(e); }); $('ex').appendChild(b); }
const EDITS = ['더 크게', '지붕을 빨갛게', '한 층 더', '둥근 지붕으로', '깃발 달아', '낡게', '기둥마다 늑대 조각', '밤에 빛나게', '날개 달아', '여기에 자동차'];
for (const e of EDITS) { const b = document.createElement('button'); b.type = 'button'; b.textContent = e; b.addEventListener('click', () => { $('q').value = e; speak(e); }); $('ed').appendChild(b); }
for (const k of Object.keys(ERAS)) { const b = document.createElement('button'); b.type = 'button'; b.textContent = ERAS[k].name; b.setAttribute('aria-pressed', k === eraKey); b.addEventListener('click', () => { eraKey = k; document.querySelectorAll('#era button').forEach(x => x.setAttribute('aria-pressed', x === b)); if (text) speak(text); }); $('era').appendChild(b); }
$('f').addEventListener('submit', e => { e.preventDefault(); speak($('q').value); });
const lv = (v, a, b, c) => v < 33 ? a : v < 66 ? b : c;
